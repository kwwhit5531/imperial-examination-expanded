l_english:
 iee_examination.0001.t:0 "A Passage Between Us"
 iee_examination.0001.desc:0 "During a supervised interval, [iee_peer.GetTitledFirstName] approaches me with a troubled expression.\n\n\"There is a passage I have never quite understood,\" [iee_peer.GetSheHe] admits. \"When a ruler's commands are mistaken, is obedience still the measure of a good servant?\"\n\nThe attendants have permitted quiet conversation, but our rest will soon be over. An explanation might sharpen my own thoughts, if I can find the right words."
 iee_examination.0001.a:0 "Let us distinguish loyalty from mere obedience."
 iee_examination.0001.a.success:0 "Explaining the distinction clarifies your own reasoning and earns your fellow candidate's gratitude."
 iee_examination.0001.a.failure:0 "Your explanation wanders, leaving you more anxious about your own understanding."
 iee_examination.0001.b:0 "I have doubts too. Let us listen to each other."
 iee_examination.0001.c:0 "Forgive me; I need these few moments to myself."

 iee_examination.0002.t:0 "A Fold of Paper"
 iee_examination.0002.desc:0 "A folded scrap slips from [iee_peer.GetTitledFirstNamePossessive] sleeve as an attendant passes the desks. [iee_peer.GetSheHe|U] hurriedly covers it with a hand.\n\nI cannot make out the writing. A concealed commentary could be grounds for punishment, but the scrap might be no more than a personal note. [iee_examiner.GetTitledFirstName] is close enough to hear a discreet word.\n\nMy own work lies unfinished before me."
 iee_examination.0002.a:0 "Let the examiner establish the facts, quietly."
 iee_examination.0002.a.tt:0 "The examiner checks the scrap discreetly. Nothing establishes that the candidate cheated."
 iee_examination.0002.b:0 "Look carefully before casting suspicion."
 iee_examination.0002.b.success:0 "You recognize a harmless household account and spare the candidate a public accusation."
 iee_examination.0002.b.failure:0 "You cannot read the scrap, and the candidate notices your scrutiny."
 iee_examination.0002.c:0 "The attendants have their duties; I have mine."

 iee_examination.0003.t:0 "A Word Out of Place"
 iee_examination.0003.desc:0 "I read the question again. Its quotation attributes a maxim to a speaker who seems to contradict the argument that follows. Has a copyist misplaced a name, or have I misunderstood a distinction every competent scholar ought to know?\n\n[iee_examiner.GetTitledFirstName] watches the room. I could ask for clarification, but doing so would expose my uncertainty. Alternatively, I might explain both readings in my answer, if I am prepared to spend the effort."
 iee_examination.0003.a:0 "Respectfully identify the apparent error."
 iee_examination.0003.a.success:0 "Your precise citation earns a clarification and strengthens your answer."
 iee_examination.0003.a.failure:0 "The examiner explains the distinction you overlooked; correcting your answer costs valuable time."
 iee_examination.0003.b:0 "Address both readings, however much work it takes."
 iee_examination.0003.c:0 "Leave that point aside and finish what I know."

 iee_score_gain_2_tt:0 "Your examination performance improves by #P 2#! points."
 iee_score_loss_1_tt:0 "Your examination performance falls by #N 1#! point."
 iee_patient_explanation_opinion:0 "Considerate Fellow Scholar"
 iee_unfounded_suspicion_opinion:0 "Unwelcome Scrutiny"
 iee_careful_observation_opinion:0 "Thoughtful Conduct"

 iee_examination.0004.t:0 "The Rain Between the Lines"
 iee_examination.0004.desc:0 "Rain finds a crack above my desk. One drop spreads across a sentence, turning careful brushwork into a dark flower. The meaning remains legible, but a replacement sheet would mean copying everything again while the examination continues around me."
 iee_examination.0004.a:0 "Copy the page before the stain spreads."
 iee_examination.0004.b:0 "Mark the damaged line and continue on dry paper."
 iee_examination.0004.c:0 "The reader will have to judge the thought beneath the blot."
 iee_examination.0005.t:0 "A Name I Must Not Write"
 iee_examination.0005.desc:0 "Halfway through a sentence, my brush pauses over a character used in an honored ancestor's personal name. At home, we substitute another character out of respect. Here, that substitution might obscure the quotation. How much explanation can a single unwritten word require?"
 iee_examination.0005.a:0 "Rephrase the entire sentence without losing its meaning."
 iee_examination.0005.b:0 "Use the family substitution and explain it briefly."
 iee_examination.0005.c:0 "Use the conventional wording of the examination text."
 iee_examination.0006.t:0 "The Last Blank Space"
 iee_examination.0006.desc:0 "My argument reaches its conclusion before my allotted paper does. The empty space below looks almost accusatory. I could fill it with another example, yet every addition offers a new opportunity to contradict something I have already written."
 iee_examination.0006.a:0 "Add a carefully chosen counterexample and answer it."
 iee_examination.0006.b:0 "Use the space to make the conclusion easier to follow."
 iee_examination.0006.c:0 "A finished argument needs no ornamental tail."
 iee_examination.0007.t:0 "The Borrowed Cadence"
 iee_examination.0007.desc:0 "Reading my answer silently, I hear my old teacher's voice in every sentence. The argument is my own, but even its pauses sound borrowed. I came here to demonstrate judgment; now I wonder whether I have merely learned to sound like someone who possesses it."
 iee_examination.0007.a:0 "Rewrite the opening in my own plain language."
 iee_examination.0007.b:0 "Acknowledge the school of thought that shaped my answer."
 iee_examination.0007.c:0 "Good teaching deserves to leave an echo."
 iee_examination.0008.t:0 "A Bell Beyond the Wall"
 iee_examination.0008.desc:0 "A funeral bell sounds beyond the compound wall. For a moment, the examination hall disappears beneath the memory of another procession, another day when ordinary work seemed impossible. Then a brush scratches nearby, and the room returns. My unfinished answer waits."
 iee_examination.0008.a:0 "Let the feeling lend gravity to the conclusion."
 iee_examination.0008.b:0 "Pause for a silent observance, then return to work."
 iee_examination.0008.c:0 "Count my breaths until the sound passes."
 iee_examination.0009.t:0 "An Answer Without Ornament"
 iee_examination.0009.desc:0 "The question asks how an official should explain an order to ordinary households. My answer is elegant, densely allusive, and almost certainly incomprehensible to the people it concerns. Each polished phrase now seems to argue against the very advice I am giving."
 iee_examination.0009.a:0 "Rewrite it as words I would actually say at a village gate."
 iee_examination.0009.b:0 "Keep the argument, but add a plain-language example."
 iee_examination.0009.c:0 "The examiner will understand the scholarly convention."
 iee_examination.0010.t:0 "Two Doors, One Queue"
 iee_examination.0010.desc:0 "While helping arrange admissions, I find two streams of arrivals converging on a narrow doorway. Those carrying bedding cannot turn around, and those behind them cannot see the obstruction. Nobody is breaking a rule; the rules simply never imagined this many bundles."
 iee_examination.0010.a:0 "Walk the route and organize a separate return passage."
 iee_examination.0010.b:0 "Stand at the junction and admit one group at a time."
 iee_examination.0010.c:0 "Ask everyone to wait while the attendants clear the doorway."
 iee_examination.0011.t:0 "The Measure of a Candle"
 iee_examination.0011.desc:0 "The supplies laid out for the examination include candles of noticeably different thicknesses. Assigning them by bundle would leave some desks dim long before others. The discrepancy is small enough to overlook, and large enough that someone will suffer from it."
 iee_examination.0011.a:0 "Sort and redistribute every candle myself."
 iee_examination.0011.b:0 "Buy a small reserve for desks that run short."
 iee_examination.0011.c:0 "Arrange for attendants to rotate the remaining lights."
 iee_examination.0012.t:0 "Names That Sound Alike"
 iee_examination.0012.desc:0 "Reading the admission list aloud produces two answers from opposite ends of the courtyard. The names sound alike in my pronunciation, though their written characters differ. If I hurry, a simple misunderstanding could follow both candidates all the way to their assigned desks."
 iee_examination.0012.a:0 "Compare each written entry with its bearer, carefully."
 iee_examination.0012.b:0 "Display the written names beside the assigned places."
 iee_examination.0012.c:0 "Ask the registration attendants to repeat the check."
 iee_examination.0013.t:0 "The Courtyard Echo"
 iee_examination.0013.desc:0 "While checking the examination rooms, I hear a whispered instruction return from the courtyard almost word for word. A handsome stone passage carries sound directly between two rows of desks. It would be unfair to blame candidates for hearing what the building insists on repeating."
 iee_examination.0013.a:0 "Test each position and rearrange the affected desks."
 iee_examination.0013.b:0 "Pay for hanging mats to soften the echo."
 iee_examination.0013.c:0 "Move instructions into the courtyard before seating begins."
 iee_examination.0014.t:0 "A Place for Every Bundle"
 iee_examination.0014.desc:0 "The storage alcove is filling with candidates' bedding, spare shoes, and travel baskets. Several bundles look identical. An attendant proposes a neat stack, but neatness will be little comfort when tired travelers ask which possessions are theirs."
 iee_examination.0014.a:0 "Record a description and a numbered place for each bundle."
 iee_examination.0014.b:0 "Purchase cord and tags for the whole alcove."
 iee_examination.0014.c:0 "Have each owner point out their place before leaving."
 iee_examination.0015.t:0 "The Empty Water Jar"
 iee_examination.0015.desc:0 "The jars outside the examination rooms have been filled, but nobody has planned how to replenish them once the corridors are occupied. Carrying water through the seated candidates would invite interruption and spills. The problem is still invisible to everyone who has not tried lifting a jar."
 iee_examination.0015.a:0 "Map a delivery route and carry the first reserve myself."
 iee_examination.0015.b:0 "Pay for additional jars near the outer doors."
 iee_examination.0015.c:0 "Assign staggered refills before the candidates are seated."
