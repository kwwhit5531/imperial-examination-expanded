l_english:
 iee_examination.0001.t:0 "A Passage Between Us"
 iee_examination.0001.desc:0 "During a supervised interval, [iee_peer.GetTitledFirstName] approaches me with a troubled expression.\n\n\"There is a passage I have never quite understood,\" [iee_peer.GetSheHe] admits. \"When a ruler's commands are mistaken, is obedience still the measure of a good servant?\"\n\nThe attendants have permitted quiet conversation, but our rest will soon be over. An explanation might sharpen my own thoughts, if I can find the right words."
 iee_examination.0001.a:0 "Let us distinguish loyalty from mere obedience."
 iee_examination.0001.a.success:0 "Explaining the distinction clarifies your own reasoning and earns your fellow candidate's gratitude."
 iee_examination.0001.a.failure:0 "Your explanation wanders, leaving you more anxious about your own understanding."
 iee_examination.0001.b:0 "I have doubts too. Let us listen to each other."
 iee_examination.0001.c:0 "Forgive me; I need these few moments to myself."

 iee_examination.0002.t:0 "A Fold of Paper"
 iee_examination.0002.desc:0 "A folded scrap slips from [iee_peer.GetTitledFirstNamePossessive] sleeve as an attendant passes the desks. [iee_peer.GetSheHe|U] hurriedly covers it with a hand.\n\nI cannot make out the writing. A concealed commentary could be grounds for punishment, but the scrap might be no more than a personal note. [iee_examiner.GetTitledFirstName] is close enough to hear a discreet word.\n\nMy own work lies unfinished before me."
 iee_examination.0002.a:0 "Let the examiner establish the facts, quietly."
 iee_examination.0002.a.tt:0 "The examiner checks the scrap discreetly. Nothing establishes that the candidate cheated."
 iee_examination.0002.b:0 "Look carefully before casting suspicion."
 iee_examination.0002.b.success:0 "You recognize a harmless household account and spare the candidate a public accusation."
 iee_examination.0002.b.failure:0 "You cannot read the scrap, and the candidate notices your scrutiny."
 iee_examination.0002.c:0 "The attendants have their duties; I have mine."

 iee_examination.0003.t:0 "A Word Out of Place"
 iee_examination.0003.desc:0 "I read the question again. Its quotation attributes a maxim to a speaker who seems to contradict the argument that follows. Has a copyist misplaced a name, or have I misunderstood a distinction every competent scholar ought to know?\n\n[iee_examiner.GetTitledFirstName] watches the room. I could ask for clarification, but doing so would expose my uncertainty. Alternatively, I might explain both readings in my answer, if I am prepared to spend the effort."
 iee_examination.0003.a:0 "Respectfully identify the apparent error."
 iee_examination.0003.a.success:0 "Your precise citation earns a clarification and strengthens your answer."
 iee_examination.0003.a.failure:0 "The examiner explains the distinction you overlooked; correcting your answer costs valuable time."
 iee_examination.0003.b:0 "Address both readings, however much work it takes."
 iee_examination.0003.c:0 "Leave that point aside and finish what I know."

 iee_score_gain_2_tt:0 "Your examination performance improves by #P 2#! points."
 iee_score_loss_1_tt:0 "Your examination performance falls by #N 1#! point."
 iee_patient_explanation_opinion:0 "Considerate Fellow Scholar"
 iee_unfounded_suspicion_opinion:0 "Unwelcome Scrutiny"
 iee_careful_observation_opinion:0 "Thoughtful Conduct"
